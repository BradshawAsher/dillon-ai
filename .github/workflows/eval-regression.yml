name: Eval Regression Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel in-flight duplicate runs on the same branch when a new commit is pushed (saving CI runner minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  run-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run Frontend Typecheck
        run: npm --prefix frontend run typecheck

      - name: Run Frontend Unit Tests
        env:
          VITE_SUPABASE_URL: "https://placeholder-project.supabase.co"
          VITE_SUPABASE_ANON_KEY: "placeholder-anon-key"
        run: npm --prefix frontend test

      - name: Run API Integration Tests
        run: npm --prefix frontend run test:api

      - name: Build Frontend Production Bundle
        env:
          VITE_SUPABASE_URL: "https://placeholder-project.supabase.co"
          VITE_SUPABASE_ANON_KEY: "placeholder-anon-key"
        run: npm --prefix frontend run build

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium with System Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx --prefix frontend playwright install-deps chromium

      - name: Run Playwright E2E Tests
        run: npm --prefix frontend run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      # Fails the job (blocking the deploy check) when the suite drops below
      # EVAL_MIN_SCORE — run-evals.ts exits non-zero on regression.
      - name: Execute Automated Eval Harness
        env:
          EVAL_MIN_SCORE: "80"
        run: npx tsx scripts/run-evals.ts

      - name: Render GitHub Actions Surface-Level Summary
        if: always()
        run: |
          cat test_sets/eval_reports/latest_eval_report.md >> $GITHUB_STEP_SUMMARY
          cat FAILURE_CASES.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Eval Report
        # Upload even when the gate fails so regressions can be inspected.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            test_sets/eval_reports/latest_eval_report.json
            test_sets/eval_reports/latest_eval_report.md
            FAILURE_CASES.md
